name: CI

on:
  push:
    branches: [master, develop]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer computes the package version from git tags.

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore src/aska.core.slnx

      - run: dotnet build src/aska.core.slnx --configuration Release --no-restore

      # Integration tests start MariaDB and PostgreSQL with Testcontainers, using the runner's Docker.
      - run: dotnet test --solution src/aska.core.slnx --configuration Release --no-build

      - run: dotnet pack src/aska.core.slnx --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/

  publish:
    name: Publish to nuget.org
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Push packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
